name: 1.1 Trait Expression UI Qualification

on:
  pull_request:
    branches:
      - work/1.1-universal-trait-expression-20261020

permissions:
  contents: read

jobs:
  trait-ui-smoke:
    name: Doctrine UI and TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Expression and Doctrine behavior
        run: npm test -- --watchAll=false --runInBand DoctrineExpressionPreview.test.ts DoctrineFocusPlayerSurface.test.tsx
        env:
          CI: true
      - name: TypeScript
        run: npx tsc --noEmit
