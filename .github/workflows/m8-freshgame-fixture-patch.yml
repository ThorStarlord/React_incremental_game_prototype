name: M8 Fresh Game Fixture Patch

on:
  push:
    branches:
      - feature/trait-discovery-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/trait-discovery-contract

      - name: Align routed fixture with authored Trait discovery
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/Relationships/state/RelationshipFreshGame.test.tsx')
          text = path.read_text(encoding='utf-8')

          old_trait = "  sourceNpc: WILLOW_ID,\n  minimumConnectionLevel: 2,"
          new_trait = "  sourceNpc: WILLOW_ID,\n  discoveryMode: 'authored',\n  minimumConnectionLevel: 2,"
          if old_trait not in text:
              raise SystemExit('Willow Trait fixture marker not found')
          text = text.replace(old_trait, new_trait, 1)

          old_effect = "traitEffects: [{ traitId: WISDOM_ID, compatibilityDelta: 5, assimilationDelta: 10 }]"
          new_effect = "traitEffects: [{ traitId: WISDOM_ID, discover: true, compatibilityDelta: 5, assimilationDelta: 10 }]"
          if old_effect not in text:
              raise SystemExit('Willow first-lesson trait effect marker not found')
          text = text.replace(old_effect, new_effect, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fixture alignment and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/m8-freshgame-fixture-patch.yml
          git add -A
          git commit -m "test(relationships): route Willow through authored Trait discovery"
          git push
