name: Build Validation

on:
  pull_request:
    branches:
      - main
      - feature/relationship-memory-vertical-slice
      - feature/elara-collaborative-relationship
      - feature/trait-discovery-contract

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: M20 Copy production automation qualification
        timeout-minutes: 6
        run: npm test -- --watchAll=false --runInBand CopyM20ProductionTaskAutomation.test.tsx
        env:
          CI: true

      - name: Active-loop repair qualification
        timeout-minutes: 5
        run: npm test -- --watchAll=false --runInBand ActiveRpgLoopIntegrationRepair.test.tsx
        env:
          CI: true

      - name: Modified historical qualification
        timeout-minutes: 8
        run: npm test -- --watchAll=false --runInBand RelationshipFreshGame.test.tsx RelationshipM14MultiNpcConsequence.test.tsx RelationshipM15LongHorizonCallback.test.tsx CombatM17TraitTacticalVerticalSlice.test.tsx
        env:
          CI: true

      - name: Accumulated M4-M19 baseline qualification
        timeout-minutes: 12
        run: npm test -- --watchAll=false --runInBand RelationshipRuntime.test.ts RelationshipLyraUniversality.test.ts RelationshipElaraCollaboration.test.ts RelationshipLyraProduction.test.tsx RelationshipGronkProduction.test.tsx RelationshipSilasProduction.test.tsx RelationshipValeriusProduction.test.tsx RelationshipM12MultiNpcProduction.test.ts RelationshipM13NarrativeIntegration.test.tsx RelationshipM14DialogueExclusivity.test.tsx QuestM16TraitDrivenGameplay.test.tsx ExplorationM18TravelVerticalSlice.test.tsx RelationshipM19WorldDerivedTether.test.ts TraitDiscovery.test.ts RelationshipLegacySaveMigration.test.ts saveSchema.test.ts saveUtils.test.ts
        env:
          CI: true

      - name: Production build
        run: npm run build
        env:
          # The repository currently has substantial pre-existing ESLint warning debt.
          # CRA treats warnings as build failures when CI=true. This gate is deliberately
          # scoped to TypeScript correctness + successful production bundling.
          CI: false
