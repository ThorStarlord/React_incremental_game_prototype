name: Build Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          # The repository currently has substantial pre-existing ESLint warning debt.
          # CRA treats warnings as build failures when CI=true. This gate is deliberately
          # scoped to TypeScript correctness + successful production bundling.
          CI: false
