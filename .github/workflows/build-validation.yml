name: Build Validation

on:
  pull_request:
    branches:
      - main
      - feature/relationship-memory-vertical-slice
      - feature/elara-collaborative-relationship
      - feature/trait-discovery-contract

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Documentation authority qualification
        run: npm run docs:authority:validate

      - name: Content intelligence qualification
        run: npm run content:intelligence:validate

      - name: Post-M25 second heterogeneous chapter qualification
        timeout-minutes: 6
        run: npm test -- --watchAll=false --runInBand PostM25SecondChapterQualification.test.ts
        env:
          CI: true

      - name: Post-M25 player insight projection qualification
        timeout-minutes: 6
        run: npm test -- --watchAll=false --runInBand PostM25PlayerInsightsQualification.test.ts
        env:
          CI: true

      - name: Post-M25 product-depth qualification
        id: product_depth
        timeout-minutes: 10
        shell: bash
        run: |
          set +e
          npm test -- --watchAll=false --runInBand PostM25RuleOfTwoChapterArchitecture.test.ts PostM25ContextualCausalLegibility.test.ts PostM25CrossDomainTraitBuildcraft.test.ts PostM25ThirdHeterogeneousChapterQualification.test.ts PostM25CopyRoutineStrategy.test.ts 2>&1 | tee /tmp/product-depth-errors.txt
          product_depth_exit=${PIPESTATUS[0]}
          echo "exit_code=${product_depth_exit}" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          CI: true

      - name: Upload product-depth diagnostics on failure
        if: steps.product_depth.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: product-depth-diagnostics
          path: /tmp/product-depth-errors.txt
          if-no-files-found: error

      - name: Enforce product-depth gate
        if: steps.product_depth.outputs.exit_code != '0'
        run: exit 1

      - name: Synthetic review contract qualification
        run: npm run simulated-review:validate

      - name: Synthetic review V2 action-binding qualification
        run: npm run simulated-review:action-contract

      - name: Type check
        id: typecheck
        shell: bash
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee /tmp/tsc-errors.txt
          typecheck_exit=${PIPESTATUS[0]}
          echo "exit_code=${typecheck_exit}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload TypeScript diagnostics on failure
        if: steps.typecheck.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: tsc-diagnostics
          path: /tmp/tsc-errors.txt
          if-no-files-found: error

      - name: Enforce TypeScript gate
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Synthetic review V2 UI-only live smoke qualification
        timeout-minutes: 6
        run: |
          HOST=127.0.0.1 PORT=3000 BROWSER=none npm start > /tmp/simulated-review-app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Synthetic review app server failed to become ready"
            cat /tmp/simulated-review-app.log
            exit 1
          fi

          if ! npm run simulated-review:smoke; then
            echo "Synthetic review live smoke failed; app log follows"
            cat /tmp/simulated-review-app.log
            exit 1
          fi
        env:
          CI: true

      - name: GameLoop timing characterization qualification
        timeout-minutes: 5
        run: npm test -- --watchAll=false --runInBand useGameLoop.timing-characterization.test.tsx
        env:
          CI: true

      - name: Async tick backlog policy contract qualification
        timeout-minutes: 6
        run: npm test -- --watchAll=false --runInBand GameLoopAsyncTickBacklogPolicyContract.test.tsx
        env:
          CI: true

      - name: Bounded backlog control repair qualification
        timeout-minutes: 6
        run: npm test -- --watchAll=false --runInBand GameLoopBoundedBacklogControlRepair.test.tsx
        env:
          CI: true

      - name: Lifecycle remainder policy qualification
        timeout-minutes: 6
        run: npm test -- --watchAll=false --runInBand GameLoopSubStepRestartSaveResumePreflight.test.tsx GameLoopLifecycleRemainderPolicy.test.ts
        env:
          CI: true

      - name: Large-frame / background-stall GameLoop qualification
        timeout-minutes: 6
        run: npm test -- --watchAll=false --runInBand GameLoopLargeFrameBackgroundStallPreflight.test.tsx
        env:
          CI: true

      - name: Mid-session cadence transition qualification
        timeout-minutes: 6
        run: npm test -- --watchAll=false --runInBand GameLoopMidSessionCadenceTransitionQualification.test.tsx
        env:
          CI: true

      - name: Backpressure x cadence progression stress qualification
        timeout-minutes: 8
        run: npm test -- --watchAll=false --runInBand GameLoopBackpressureCadenceProgressionStressQualification.test.tsx
        env:
          CI: true

      - name: Cross-progression tick determinism characterization
        timeout-minutes: 6
        run: npm test -- --watchAll=false --runInBand GameLoopProgressionDeterminism.test.tsx
        env:
          CI: true

      - name: Long-horizon cross-progression drift qualification
        timeout-minutes: 8
        run: npm test -- --watchAll=false --runInBand GameLoopLongHorizonCrossProgressionDrift.test.tsx
        env:
          CI: true

      - name: Timed Quest unit and save-compatibility preflight
        timeout-minutes: 5
        run: npm test -- --watchAll=false --runInBand QuestTimerUnitCompatibilityPreflight.test.ts
        env:
          CI: true

      - name: Quest timing integration qualification
        timeout-minutes: 6
        run: npm test -- --watchAll=false --runInBand GameLoopQuestTimingIntegrationQualification.test.tsx
        env:
          CI: true

      - name: Timed Quest precision preflight decision regression
        timeout-minutes: 6
        run: npm test -- --watchAll=false --runInBand GameLoopTimedQuestPrecisionPreflight.test.tsx
        env:
          CI: true

      - name: Timed Quest precision semantics resolution
        timeout-minutes: 6
        run: npm test -- --watchAll=false --runInBand GameLoopTimedQuestPrecisionResolution.test.tsx
        env:
          CI: true

      - name: Live/offline progression boundary qualification
        timeout-minutes: 6
        run: npm test -- --watchAll=false --runInBand GameLoopLiveOfflineBoundary.test.tsx
        env:
          CI: true

      - name: M25 complete chapter vertical slice qualification
        timeout-minutes: 8
        run: npm test -- --watchAll=false --runInBand M25CompleteChapterVerticalSlice.test.tsx
        env:
          CI: true

      - name: M24 objective world state qualification
        timeout-minutes: 6
        run: npm test -- --watchAll=false --runInBand M24ObjectiveWorldState.test.tsx
        env:
          CI: true

      - name: M23 faction reputation qualification
        timeout-minutes: 6
        run: npm test -- --watchAll=false --runInBand M23FactionReputation.test.tsx
        env:
          CI: true

      - name: M22 social knowledge propagation qualification
        timeout-minutes: 6
        run: npm test -- --watchAll=false --runInBand M22SocialKnowledgePropagation.test.tsx
        env:
          CI: true

      - name: Checkpoint C incremental integration repair qualification
        timeout-minutes: 6
        run: npm test -- --watchAll=false --runInBand CheckpointCIncrementalIntegrationRepair.test.tsx
        env:
          CI: true

      - name: M21 bounded offline progress qualification
        timeout-minutes: 6
        run: npm test -- --watchAll=false --runInBand GameLoopM21OfflineProgress.test.ts
        env:
          CI: true

      - name: M20 Copy production automation qualification
        timeout-minutes: 6
        run: npm test -- --watchAll=false --runInBand CopyM20ProductionTaskAutomation.test.tsx
        env:
          CI: true

      - name: Active-loop repair qualification
        timeout-minutes: 5
        run: npm test -- --watchAll=false --runInBand ActiveRpgLoopIntegrationRepair.test.tsx
        env:
          CI: true

      - name: Modified historical qualification
        timeout-minutes: 8
        run: npm test -- --watchAll=false --runInBand RelationshipFreshGame.test.tsx RelationshipM14MultiNpcConsequence.test.tsx RelationshipM15LongHorizonCallback.test.tsx CombatM17TraitTacticalVerticalSlice.test.tsx
        env:
          CI: true

      - name: Accumulated M4-M19 baseline qualification
        timeout-minutes: 12
        run: npm test -- --watchAll=false --runInBand RelationshipRuntime.test.ts RelationshipLyraUniversality.test.ts RelationshipElaraCollaboration.test.ts RelationshipLyraProduction.test.tsx RelationshipGronkProduction.test.tsx RelationshipSilasProduction.test.tsx RelationshipValeriusProduction.test.tsx RelationshipM12MultiNpcProduction.test.ts RelationshipM13NarrativeIntegration.test.tsx RelationshipM14DialogueExclusivity.test.tsx QuestM16TraitDrivenGameplay.test.tsx ExplorationM18TravelVerticalSlice.test.tsx RelationshipM19WorldDerivedTether.test.ts TraitDiscovery.test.ts RelationshipLegacySaveMigration.test.ts saveSchema.test.ts saveUtils.test.ts
        env:
          CI: true

      - name: Production build
        run: npm run build
        env:
          # The repository currently has substantial pre-existing ESLint warning debt.
          # CRA treats warnings as build failures when CI=true. This gate is deliberately
          # scoped to TypeScript correctness + successful production bundling.
          CI: false
