name: M8 Authoring Patch

on:
  push:
    branches:
      - feature/trait-discovery-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/trait-discovery-contract

      - name: Mark authored Trait discovery beats
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          updates = [
              (Path('public/data/relationships/elder-willow.json'), 'willow_exp_first_lesson', 'WillowsWisdom'),
              (Path('public/data/relationships/elara.json'), 'elara_exp_contradictory_footnote', 'ScholarlyInsight'),
          ]

          for path, experience_id, trait_id in updates:
              data = json.loads(path.read_text(encoding='utf-8'))
              effects = data['experiences'][experience_id]['traitEffects']
              effect = next(effect for effect in effects if effect['traitId'] == trait_id)
              effect['discover'] = True
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Commit qualified authoring patch and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/m8-authoring-patch.yml
          git add -A
          git commit -m "feat(relationships): reveal Traits through authored evidence"
          git push
