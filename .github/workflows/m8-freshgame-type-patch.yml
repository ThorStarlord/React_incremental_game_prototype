name: M8 Fresh Game Type Patch

on:
  push:
    branches:
      - feature/trait-discovery-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/trait-discovery-contract

      - name: Preserve discovery mode literal type
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/Relationships/state/RelationshipFreshGame.test.tsx')
          text = path.read_text(encoding='utf-8')
          old = "  discoveryMode: 'authored',"
          new = "  discoveryMode: 'authored' as const,"
          if old not in text:
              raise SystemExit('Discovery mode fixture marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit type fix and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/m8-freshgame-type-patch.yml
          git add -A
          git commit -m "test(relationships): preserve authored discovery literal type"
          git push
