name: M4 Test Harness Fix

on:
  push:
    branches:
      - feature/relationship-memory-vertical-slice

permissions:
  contents: write

jobs:
  patch-qualify-and-self-delete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/relationship-memory-vertical-slice
          fetch-depth: 0

      - name: Make authored-data fetch stub per-test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/Relationships/state/RelationshipRuntime.test.ts')
          text = path.read_text(encoding='utf-8')
          old = "beforeAll(() => {\n  global.fetch = jest.fn(async () => ({"
          new = "beforeEach(() => {\n  global.fetch = jest.fn(async () => ({"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one fetch-stub beforeAll block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git rm .github/workflows/m4-test-harness-fix.yml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Relationship runtime tests
        run: npm test -- --watchAll=false --runInBand RelationshipRuntime.test.ts
        env:
          CI: true

      - name: Production build
        run: npm run build
        env:
          CI: false

      - name: Commit qualified test-harness fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(m4): restore authored relationship fetch per test'
          git push origin HEAD:feature/relationship-memory-vertical-slice
